makes:
- make: gm
  full_name: General Motors (Chevrolet / Buick / GMC / Cadillac)
  buses:
  - name: High-Speed GMLAN
    bitrate_kbps: 500
    obd2_pins:
    - 6
    - 14
    wire_count: 2
    years: 2004+ (full by 2008)
    grade: A
    notes: Powertrain/chassis bus. 120-ohm terminators at each end; ~60 ohms across DLC 6/14 (key off) is the standard health
      check.
    evidence: OEM-GM-TECH (three buses, BCM gateway); OEM-GM-PIN (pins 6/14)
  - name: Mid-Speed GMLAN
    bitrate_kbps: 95.2
    obd2_pins:
    - 3
    - 11
    wire_count: 2
    years: 2004+
    grade: A
    notes: "Infotainment (display, navigation). BITRATE CONFLICT: ACDelco says 95.2 kbps [A]; GM Enhanced Diag spec excerpt\
      \ says 'approximately 95.2 or 125 kbps' [B] \u2014 treat as model-dependent."
    evidence: OEM-GM-TECH (95.2 kbps); OEM-GM-PIN (pins 3/11); OEM-GM-SPEC (95.2-or-125 conflict)
  - name: Single-Wire (Low-Speed) GMLAN
    bitrate_kbps: 33.33
    obd2_pins:
    - 1
    wire_count: 1
    years: 2004+
    grade: B
    notes: Per GMW3089. 83.33 kbps high-speed mode used for flashing (transceiver must switch, not just the CAN bitrate).
      Sleeping nodes REQUIRE high-voltage wake-up before they answer normal traffic.
    evidence: OEM-GM-NXP (GMW3089v2.4, 33.33/83.33 kbps, HV wake-up); OEM-GM-PIN (pin 1)
  - name: Second High-Speed GMLAN (select models)
    bitrate_kbps: 500
    obd2_pins:
    - 12
    - 13
    wire_count: 2
    years: model-dependent
    grade: C
    notes: "CONFLICT: a 2010 Camaro reportedly has a second HS bus on DLC 12/13 [C], but the 2002 Intrepid pinout labels 12/13\
      \ 'LSFT H/L' (discretionary) [B]. Pin 12/13 usage varies by model/year \u2014 verify per vehicle."
    evidence: OEM-GM-COMM (2010 Camaro report [C]); OEM-GM-PIN (12/13 discretionary [B])
  legacy:
  - protocol: Class 2 / SAE J1850 VPW
    bitrate_kbps: 10.4
    obd2_pins:
    - 2
    years: "1996\u2013~2007 (gradual, model-dependent)"
    grade: B
    notes: "VPW uses pin 2 ONLY (pin 10 is the J1850 PWM negative leg \u2014 Ford, not GM). Phase-in of GMLAN began 2004;\
      \ 2005 Colorado/Yukon still VPW per owner reports; complete by the 2008 federal CAN mandate."
    evidence: OEM-GM-COMM (year anecdotes); 2008 mandate (regulatory fact)
  m2_mapping:
  - m2_hardware: CAN0 (TJA1051, HSC_BUS)
    bus: High-Speed GMLAN (6/14)
    notes: 500 kbps via due_can. Standard M2RET/ELM path.
  - m2_hardware: CAN1 (TJA1051, MSC_BUS)
    bus: Mid-Speed GMLAN (3/11)
    notes: "The M2's CAN1 transceiver is wired to DLC 3/11 \u2014 exactly the GMLAN mid-speed pins. No extra hardware needed;\
      \ set due_can to 95.2 or 125 kbps per model."
  - m2_hardware: SWCAN (MCP2515 + TH8056, SWC_BUS)
    bus: Single-Wire GMLAN (pin 1)
    notes: setupSW(33) normal / setupSW(83) flashing; mode(2) HV-wake BEFORE expecting replies from sleeping modules, then
      mode(3).
  - m2_hardware: J1850 discrete circuit, VPW mode (pin 50 LOW)
    bus: Class 2 (pin 2)
    notes: 'VPW-only on GM: use pin 52 (VPW RX) / pin 53 (J1850+ TX). M2 J1850- (DLC pin 10) has no GM use.'
- make: ford
  full_name: Ford / Lincoln / Mercury
  buses:
  - name: HS-CAN
    bitrate_kbps: 500
    obd2_pins:
    - 6
    - 14
    wire_count: 2
    years: 2004+ (full by 2008)
    grade: B
    notes: "Powertrain bus; also the legislated emissions bus (ISO 15765-4) \u2014 any generic OBD-II tool sees it. Modules:\
      \ PCM, TCM, ABS, EPAS."
    evidence: OEM-FORD-COMM (pinout consensus); legislated emissions bus (SAE J1979)
  - name: MS-CAN
    bitrate_kbps: 125
    obd2_pins:
    - 3
    - 11
    wire_count: 2
    years: ~2003+ (not all models)
    grade: B
    notes: "Ford-PROPRIETARY pins \u2014 dead on non-Ford vehicles. Body/comfort: GEM, doors, cluster, RCM, EATC. This pin\
      \ split is why FORScan needs the HS/MS toggle on ELM327 adapters. BITRATE CONFLICT: one community glossary claims '125-500\
      \ kbps depending on chassis' [C] vs unanimous 125 kbps \u2014 treat 125 as standard. MS-CAN is NOT on all Fords: probe,\
      \ don't assume."
    evidence: OEM-FORD-FORSCAN (adapter table, pins 3/11); OEM-FORD-COMM (125 kbps consensus)
  - name: HS-CAN2
    bitrate_kbps: 500
    obd2_pins: []
    wire_count: 2
    years: newer platforms
    grade: C
    notes: Second high-speed bus on newer platforms (FDSM, ABS, RCM, PSCM, SCCM, GWM, IPMA per one vendor source). DLC availability
      varies; often gateway-internal only.
    evidence: OEM-FORD-COMM (kanbkam adapter listing [C])
  - name: CAN FD
    bitrate_kbps: 500
    obd2_pins:
    - 6
    - 14
    wire_count: 2
    years: 2021+ select models (F-150, Lightning, Mach-E, Escape 2023+, Expedition/Navigator 2022+, Nautilus 2024)
    grade: B
    notes: 'M2 CANNOT PARTICIPATE: TJA1051 transceivers are CAN 2.0 only. 2021+ CAN-FD Fords are out of scope for M2 CAN work
      (hardware fact from the knowledge pack; vehicle consequence inferred but solid).'
    evidence: OEM-FORD-OPEN (CANFD platform list, verified in opendbc values.py); OEM-KPACK (TJA1051 CAN 2.0 only)
  legacy:
  - protocol: SCP / SAE J1850 PWM
    bitrate_kbps: 41.6
    obd2_pins:
    - 2
    - 10
    years: "1996\u2013~2006 (model-dependent); all-CAN by 2008 mandate"
    grade: B
    notes: "Ford's SCP variant REQUIRES In-Frame Response (IFR) bytes \u2014 unlike GM's VPW. Timeline approx: 1996-2001 PWM-only,\
      \ 2002-2006 mixed by model, post-2006 CAN."
    evidence: OEM-FORD-COMM (AutoEnginuity docs, Ford training material)
  m2_mapping:
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: HS-CAN (6/14) @ 500 kbps
    notes: Standard path.
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: MS-CAN (3/11) @ 125 kbps
    notes: "KEY M2 ADVANTAGE: a switched ELM327 sees one bus at a time, but the M2's two independent CAN controllers can watch\
      \ HS-CAN and MS-CAN SIMULTANEOUSLY \u2014 FORScan+ELM327 cannot do this."
  - m2_hardware: J1850 discrete circuit, PWM mode (pin 50 HIGH)
    bus: SCP (pins 2/10)
    notes: Pre-2004 Fords. IFR bytes REQUIRED by Ford's SCP variant.
  - m2_hardware: LIN1/LIN2 (TJA1027)
    bus: Body LIN sub-buses
    notes: Door/climate sub-buses on some models, if tapped at the module.
  - m2_hardware: NONE
    bus: CAN FD (2021+)
    notes: "Out of scope \u2014 TJA1051 is CAN 2.0 only."
- make: stellantis
  full_name: Stellantis (Chrysler / Dodge / Jeep / RAM / Fiat / Alfa Romeo)
  buses:
  - name: CAN-C1
    bitrate_kbps: 500
    obd2_pins:
    - 6
    - 14
    wire_count: 2
    years: ~2004/05+
    grade: A
    notes: Powertrain/chassis high-speed CAN (SAE J2284). 11-bit identifiers the norm. 120-ohm terminators; ~60 ohms per pair
      (key off) = continuity check.
    evidence: OEM-STLA-STAR (pins 6/14 [A]); OEM-STLA-COMM (500 kbps [B], 11-bit IDs [B])
  - name: CAN-C2
    bitrate_kbps: 500
    obd2_pins:
    - 12
    - 13
    wire_count: 2
    years: some platforms
    grade: C
    notes: "Second high-speed CAN on some platforms (e.g. Alfa/Fiat 'second high-speed CANBUS' per aftermarket vendors). Pins\
      \ confirmed [A]; BITRATE UNCONFIRMED \u2014 treat 500 kbps as provisional."
    evidence: OEM-STLA-STAR (pins 12/13 [A]); OEM-STLA-COMM (bitrate [?])
  - name: CAN-BH
    obd2_pins:
    - 3
    - 11
    wire_count: 2
    years: ~2004/05+
    grade: C
    notes: Body/harness CAN. Pins confirmed [A]; BITRATE UNCONFIRMED. NOT reachable with stock M2 hardware (both native CAN
      controllers spoken for by C1/C2; MCP2515 is tied to the SWCAN transceiver).
    evidence: OEM-STLA-STAR (pins 3/11 [A])
  - name: CAN-IHS
    bitrate_kbps: 125
    obd2_pins: []
    wire_count: 2
    years: ~2004/05+
    grade: B
    notes: "'Interior High Speed' is the SLOW bus (125 kbps) \u2014 the name misleads. Interior/comfort modules. Not on the\
      \ DLC; reachable only via gateway or direct tap."
    evidence: OEM-STLA-COMM (125 kbps, SAE Class B)
  legacy:
  - protocol: PCI / SAE J1850 VPW
    bitrate_kbps: 10.4
    obd2_pins:
    - 2
    years: "~1999\u2013~2005 (model-dependent)"
    grade: B
    notes: Single wire, idle low, active high ~7-7.5V. Used for inter-module comms and scan-tool/flash until CAN replaced
      it.
    evidence: OEM-STLA-COMM
  - protocol: CCD (Chrysler Collision Detection)
    bitrate_kbps: 7.8125
    obd2_pins:
    - 3
    - 11
    years: "1988\u2013~1998"
    grade: C
    notes: "Proprietary 2-wire bus. TRAP: pins 3/11 were later recycled for CAN-BH \u2014 year/model determines which protocol\
      \ is on those pins."
    evidence: OEM-STLA-COMM
  - protocol: SCI (SAE J2610, Chrysler-proprietary serial)
    obd2_pins:
    - 6
    - 7
    - 9
    - 12
    - 14
    - 15
    wire_count: 1
    years: "1990s\u2013early 2000s (PCM/TCM flashing)"
    grade: C
    notes: "UART-based proprietary serial for PCM/TCM diagnostics and flash reprogramming. Multiple channels (SCI A Engine/Trans,\
      \ SCI B); pin assignments vary by model/year. M2 HAS NO SCI HARDWARE \u2014 pre-CAN Chrysler powertrain flashing via\
      \ SCI is out of reach for stock M2 firmware."
    evidence: OEM-STLA-COMM
  - protocol: K-line (ISO 9141-2 / ISO 14230)
    bitrate_kbps: 10.4
    obd2_pins:
    - 7
    wire_count: 1
    years: "1996\u2013~2004"
    grade: B
    notes: On many 1996-~2004 models alongside PCI/SCI. M2 K-line transceiver (TJA1027) covers this.
    evidence: OEM-STLA-COMM
  m2_mapping:
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: CAN-C1 (6/14) @ 500 kbps
    notes: Primary diagnostic bus. On 2018+ SGW vehicles, reads work through the gateway; writes are blocked.
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: CAN-C2 (12/13)
    notes: Second native controller covers this where present.
  - m2_hardware: NONE (stock)
    bus: CAN-BH (3/11)
    notes: "Not reachable with stock M2 hardware \u2014 would need an external CAN transceiver on SPI."
  - m2_hardware: J1850 discrete circuit, VPW mode (pin 50 LOW)
    bus: PCI (pin 2)
    notes: Pre-CAN Chrysler.
  - m2_hardware: K-line (TJA1027)
    bus: ISO 9141 K-line (pin 7)
    notes: 1996-~2004 models.
  - m2_hardware: LIN1/LIN2 (TJA1027)
    bus: LIN sub-buses (e.g. CCN -> multifunction switch)
    notes: If tapped at the module; plain 19.2k-class LIN.
  - m2_hardware: NONE
    bus: SCI (J2610)
    notes: "No M2 hardware support \u2014 proprietary serial, not J1850/K-line/LIN."
- make: toyota
  full_name: Toyota / Lexus
  buses:
  - name: CAN V Bus (HS)
    bitrate_kbps: 500
    obd2_pins:
    - 6
    - 14
    wire_count: 2
    years: 2004+
    grade: B
    notes: 'Powertrain/chassis: ECM, HV ECU, battery ECU, skid control, EPS, airbag, gateway ECU. Termination spec 54-69 ohms
