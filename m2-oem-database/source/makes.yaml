    evidence: OEM-TOYOTA-TRAIN (500k HS); OEM-TOYOTA-SVC (pins 6/14, 54-69 ohm [A])
  - name: MS-CAN
    bitrate_kbps: 250
    obd2_pins: []
    wire_count: 2
    years: 2004+
    grade: B
    notes: "Body/comfort traffic BEHIND the gateway ECU \u2014 not on the DLC in any source found. A scan tool reaches it\
      \ only through gateway routing."
    evidence: OEM-TOYOTA-TRAIN (250k MS); DLC absence inferred from gateway architecture [C]
  legacy:
  - protocol: K-line / SIL (ISO 9141-2)
    bitrate_kbps: 10.4
    obd2_pins:
    - 7
    years: pre-2008+ (survived into CAN era)
    grade: B
    notes: DLC3 pin 7 (SIL), optional L-line pin 15. Non-CAN modules (TPMS, air suspension) used K-line deep into the CAN
      era.
    evidence: OEM-TOYOTA-SVC (SIL pulse on pin 7 [A]); OEM-TOYOTA-COMM
  - protocol: BEAN (Body Electronics Area Network)
    bitrate_kbps: 10
    obd2_pins: []
    wire_count: 1
    years: early 2000s+
    grade: B
    notes: "Toyota-PROPRIETARY single-wire body bus, 0-10V. NO M2 HARDWARE SUPPORT \u2014 not J1850, not K-line, not LIN."
    evidence: OEM-TOYOTA-TRAIN (BEAN 10k); community RE frame format [C]
  - protocol: AVC-LAN
    bitrate_kbps: 17.8
    obd2_pins: []
    wire_count: 2
    years: early 2000s+
    grade: B
    notes: Toyota-proprietary audio/visual bus; star topology. Not a diagnostic target.
    evidence: OEM-TOYOTA-TRAIN
  m2_mapping:
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: HS CAN V Bus (6/14) @ 500 kbps
    notes: Primary diagnostic + logging bus. One controller normally suffices at the DLC (no HS/MS pin split like Ford).
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: MS-CAN @ 250 kbps
    notes: "Only if tapped behind the gateway (interior harness) \u2014 not on the DLC."
  - m2_hardware: K-line (TJA1027)
    bus: SIL K-line (pin 7) @ 10.4 kbps
    notes: Non-CAN modules on CAN-era vehicles; pre-CAN diagnostics.
  - m2_hardware: LIN1/LIN2 (TJA1027)
    bus: LIN sub-buses @ 9.6 kbps
    notes: If tapped at the module.
  - m2_hardware: NONE
    bus: BEAN
    notes: "Out of reach \u2014 proprietary 0-10V single-wire protocol, no M2 hardware speaks it."
- make: honda
  full_name: Honda / Acura
  buses:
  - name: F-CAN
    bitrate_kbps: 500
    obd2_pins:
    - 6
    - 14
    wire_count: 2
    years: 2003+
    grade: A
    notes: "Powertrain bus: ECM/PCM, TCM, ABS/VSA, EPS, SRS. TWO SEGMENTS: F-CAN A (OBD-II/diagnostic side) and F-CAN B (internal\
      \ powertrain) \u2014 openpilot relays between them."
    evidence: OEM-HONDA-SVC (500k [A]); opendbc hondacan.py (A/B segments [B])
  - name: B-CAN
    bitrate_kbps: 33.33
    obd2_pins: []
    wire_count: 1
    years: 2006+
    grade: A
    notes: "Body CAN: gauge module, MICU, climate, immobilizer-keyless. SINGLE-WIRE 33.33 kbps per service manual. NEVER at\
      \ the DLC \u2014 requires a behind-dash tap (BCM 36-pin connector on 2016 Civic/2017 CR-V). SPEED CONFLICT: one community\
      \ project claims 150 kbps on 2016+ [C] \u2014 unverified, contradicts the manual."
    evidence: 'OEM-HONDA-SVC (single-wire 33.33k [A]); conflict: vanillagorillaa project [C]'
  - name: IMA CAN (hybrids)
    obd2_pins: []
    wire_count: 2
    years: hybrids
    grade: B
    notes: Separate CAN bus for the Integrated Motor Assist hybrid system; own malfunction DTCs.
    evidence: OEM-HONDA-COMM (2019 Civic scan report)
  legacy:
  - protocol: K-line (ISO 9141-2)
    bitrate_kbps: 10.4
    obd2_pins:
    - 7
    years: 1990s-2010s
    grade: A
    notes: Honda was a heavy K-line user and NEVER used J1850. Pin 7 kept populated alongside CAN into the 2010s (SRS/ABS/VSA/EPS/immobilizer
      K-line troubleshooting in service manual).
    evidence: OEM-HONDA-SVC (DLC pin 7 K-line circuit [A])
  - protocol: SCS (Service Check Signal)
    obd2_pins:
    - 9
    years: 1990s+
    grade: B
    notes: 'Honda-SPECIFIC pin 9: grounding it puts modules into service-check / blink-code mode. Readable as a digital input;
      a diagnostic aid, not a bus.'
    evidence: OEM-HONDA-COMM
  m2_mapping:
  - m2_hardware: CAN0 / CAN1 (TJA1051)
    bus: F-CAN (6/14) @ 500 kbps
    notes: This is F-CAN A (diagnostic side) at the DLC; F-CAN B (powertrain) sits behind the gateway.
  - m2_hardware: SWCAN (MCP2515 + TH8056)
    bus: B-CAN 33.33k single-wire
    notes: "NATURAL FIT (inferred): single-wire 33.33 kbps CAN matches the TH8056. setupSW(33). ONLY via BCM-harness tap \u2014\
      \ never the DLC. Caveat: if the 150 kbps B-CAN claim proves true for 2016+, the TH8056 cannot do that rate."
  - m2_hardware: K-line (TJA1027)
    bus: K-line (pin 7) @ 10.4 kbps
    notes: Pre-CAN diagnostics and still-populated K-line on CAN-era Hondas.
  - m2_hardware: 12VIO digital input
    bus: SCS (pin 9)
    notes: Readable as a digital input; grounding enters service-check mode.
  - m2_hardware: NONE
    bus: J1850
    notes: "Honda never used J1850 \u2014 the M2 J1850 hardware has no Honda application."
