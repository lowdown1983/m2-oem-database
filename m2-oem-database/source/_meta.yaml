pack: M2/SuperB OEM Vehicle Database
pack_version: 1.4.0
date: '2026-10-07'
scope: 'Big Three v1: GM, Ford, Stellantis. Bus architecture, diagnostic access, and opendbc message catalogs.'
method: "Separate database from the hardware knowledge pack (v1.4.0): vehicle data is community-sourced\
  \ and variable-quality, so it carries its own evidence grades rather than diluting the hardware pack's\
  \ bar. Bus/diagnostic facts were researched per-make by three agents (2026-10-06) using web primary\
  \ sources; message catalogs were mechanically harvested from a shallow clone of commaai/opendbc. Every\
  \ factual claim carries a grade: A = factory documentation or verified capture; B = reputable community\
  \ source (opendbc, FORScan docs, well-documented reverse-engineering, trade press); C = single anecdotal\
  \ report or vendor marketing. Source conflicts are reported, not silently resolved. No seed/key algorithm\
  \ or gateway bypass is invented or reproduced anywhere in this database \u2014 only publicly documented,\
  \ legitimate access paths.\n"
grades:
  A: Factory documentation or verified capture.
  B: 'Reputable community source: opendbc, FORScan docs, well-documented reverse-engineering, trade press.'
  C: Single anecdotal report or vendor marketing copy.
