changelog:
- version: 1.4.0
  date: '2026-10-07'
  notes: 'Three-track expansion. (1) Five new makes: Subaru (SSM2 protocol + 30-entry SSM parameter-address
    catalog, FSI/FSM DTCs, module maps), Mazda (HS/MS-CAN era split, DTCs, module maps), BMW (E/F/G bus
    generations, 0x6F1 KWP2000 diagnostic scheme, factory hex DTCs, module maps), Mercedes-Benz (CAN-B/C/D/E,
    filtered-DLC behavior, DAS/community DTCs, module maps), Volvo (P1/P2/P3 dual-CAN + CEM gateway, proprietary
    diagnostic addressing, CEM module-code DTCs, module maps). (2) Thin-spot fills: +4 Stellantis DIDs,
    +18 Honda/VW body/chassis DIDs (with DID-reuse conflict notes), Hyundai/Kia B/C/U corroboration (117
    codes -> A, 50 -> B; truncated descriptions expanded; 7 conflicts + 1 not-found carried with caveats).
    (3) Import DTC expansion: +175 Toyota/Lexus, +Honda P-codes and SRS/ABS/VSA blink-code mappings (as
    their own entries, never forced into B1xxx/C1xxx), +183 Nissan/Infiniti. Schema notes: DTC code pattern
    widened (BMW factory hex, Honda blink codes, Volvo module codes, UDS failure-type byte); DID make
    enum + pattern widened (Subaru 3-byte SSM addresses, service SSM2). Known gaps: Mazda/Volvo/Mercedes
    manufacturer DID catalogs effectively empty; G-series BMW / SPA-CMA Volvo / 2021+ Mercedes secure-gateway
    = out of M2 scope (CAN FD / DoIP / Ethernet).'
- version: 1.3.0
  date: '2026-10-06'
  notes: 'Platform-level depth (no VIN required): 581 UDS DIDs (36 ISO-standard [A] + 545 make-specific:
    GM 7, Ford 13, Stellantis 3, Toyota 124, Honda 59, VW 280, Hyundai 33, Nissan 26); Nissan entries
    flagged 0x21-local (KWP2000-style local IDs, not 0x22). Ford as-built reference: 41 module addresses
    with block ranges, checksum/format spec, UDS read/write mapping. Per-platform bus/module maps for
    all 32 DBC platforms (DBC node names cross-checked against bus briefs; gateway-forwarded traffic flagged).
    Known thin spots: Stellantis DIDs (single community source), VAG/Honda B/C-code DIDs, Hyundai ECU-scoped
    DID numbering.'
- version: 1.2.1
  date: '2026-10-06'
  notes: 'Import DTC expansion: +851 manufacturer-specific codes (108 Toyota/Lexus, 90 Honda/Acura, 140
    VW Group, 440 Hyundai/Kia, 73 Nissan/Infiniti). Total catalog now 3,344 DTCs across all 8 makes. Same
    per-entry format and A/B/C grading as v1.2.0. Known thin spots: VAG B/C codes (5-digit only, no verified
    P/B/C equivalents), Honda B1xxx/C1xxx (blink-code era), Hyundai B/C/U single-source sections.'
- version: 1.2.0
  date: '2026-10-06'
  notes: 'New DTC catalog: 2,493 trouble codes (2,098 SAE J2012 generic + 395 Big Three manufacturer-specific:
    107 GM, 182 Ford, 106 Stellantis). Each entry: code, description, category, scope, possible causes
    and diagnostic notes where sources support them (186 with causes, 242 with notes), graded A/B/C (27/1080/1386).
    Inference-flagged causes/notes from researchers were omitted rather than laundered. Ford split-grade
    entries keep the description grade with grade detail preserved in evidence. Imports (Toyota/Honda/VW/Hyundai/Nissan)
    deferred to v1.2.1.'
- version: 1.1.0
  date: '2026-10-06'
  notes: 'Added Toyota/Lexus, Honda/Acura, VW Group, Hyundai/Kia, Nissan/Infiniti (8 makes total). Signal-level
    decode for ALL 32 DBCs: 21,568 signals with start bit, length, byte order, factor, offset, unit. Big
    Three message count 1366 -> 1368 (whitespace-aware parser now includes two indented BO_ records in
    gm_global_a_object.dbc). New findings: Honda B-CAN maps to M2 SWCAN circuit; Toyota DLC3 is HS-CAN
    only; VW SFD blocks writes but not reads or bootloader flashing; Hyundai/Kia use KWP2000-over-CAN
    (2005-2010); Nissan uses KWP-style 0x21 reads (0x22 rejected) and has a query-only BCM gateway DLC.'
- version: 1.0.0
  date: '2026-10-06'
  summary: 'Initial Big Three release: bus architecture + diagnostic access for GM, Ford, Stellantis;
    16 opendbc DBCs (1366 messages); 12-question validation.'
