- did: '0xB0'
  name: ECU Diagnostic Address
  description: Returns the ECU's diagnostic address. Used by the tester (with DID $B0 table) to determine
    the relationship of each ECU's diagnostic address to its physical request/response CAN identifiers
    during setup of the base diagnostic configuration matrix. Required in boot software (except SPS_TYPE_C
    ECUs).
  make: gm
  ecu_context: ''
  size: not documented
  session: boot software (SPS programming); operational-software availability not documented
  security: boot-software pseudo code assumes the ECU is unlocked when operating out of boot software
  service: '0x22'
  grade: A
  evidence: "OEM-DID-BIG3 \u2014 GMW3110 (GM Worldwide Engineering Standard, Feb 2010) \xA79.3.2.4.2,\
    \ via pcmhacking.net mirror"
