- did: '0xD100'
  name: ECU Operating State / Mode
  description: 'Contains the ECU''s current operating state/mode as a 1-byte state-encoded value. Supported
    by ALL Ford ECUs. Values: $01 = Operational State; $02 = Diagnostic State; $03 = On-Demand Self-Test
    / Execution Routine State; $07 = Information Transfer State; $09 = No Stored Codes Logging State;
    $0A = Input Integrity Test State; $0B = Secure Diagnostic State; $0D = Manufacturer State.'
  make: ford
  ecu_context: ''
  size: "1 byte (SED \u2014 state encoded)"
  session: not documented
  security: not documented
  service: '0x22'
  grade: A
  evidence: "OEM-DID-BIG3 \u2014 Ford Global Diagnostic Specification Part One v2003.0 \xA716.7.3 / Table\
    \ 16.4, via Caltech archive"
